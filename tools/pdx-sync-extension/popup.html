<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      background: #0284c7;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    h3 {
      font-size: 14px;
      margin: 0;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-sizing: border-box;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    #status {
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
      display: none;
      margin-top: 10px;
      text-align: center;
      word-break: break-word;
    }
    .success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .last {
      font-size: 11px;
      margin: 0 0 12px 0;
      color: #94a3b8;
      word-break: break-word;
    }
    .last.ok { color: #34d399; }
    .last.bad { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">EQP</span>
    <h3>Komatsu PDX Session</h3>
  </div>
  <p>Syncs your Komatsu PDX login to EQP automatically whenever it changes. Just log in to PDX in this browser.</p>

  <label for="serverUrl">EQP server URL</label>
  <input id="serverUrl" type="text" placeholder="https://eqp-1.onrender.com" />
  <label for="syncToken">Sync token (PDX_SYNC_TOKEN)</label>
  <input id="syncToken" type="password" placeholder="Ask your EQP admin" />
  <div class="row">
    <input id="autoSync" type="checkbox" />
    <label for="autoSync" style="margin:0">Sync automatically</label>
  </div>
  <button id="btnSave" class="btn btn-secondary">💾 Save Settings</button>

  <div id="lastSync" class="last"></div>

  <button id="btnSync" class="btn btn-primary">⚡ Sync Now</button>
  <button id="btnCopy" class="btn btn-secondary">📋 Copy Full Cookie to Clipboard</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
